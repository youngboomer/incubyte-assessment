services:
  frontend:
    build: ./web
    container_name: comppulse-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:65524
      PORT: "65525"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:65525:65525"
    networks:
      - edge
      - internal
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: comppulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/comppulse.db
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      HR_EMAIL: ${HR_EMAIL:-ss@interview.chetan}
      HR_PASSWORD: ${HR_PASSWORD:-incubyte}
      HR_PASSWORD_HASH: ${HR_PASSWORD_HASH:-}
      APP_ENV: ${APP_ENV:-development}
      TOKEN_MAX_AGE_SECONDS: ${TOKEN_MAX_AGE_SECONDS:-43200}
      SEED_COUNT: ${SEED_COUNT:-10000}
    volumes:
      - db_data:/data
    networks:
      - internal

networks:
  # Docker does not publish a port for a container that is only on an
  # internal network. edge is the host-facing bridge for 127.0.0.1:65525.
  edge:
  internal:
    internal: true

volumes:
  db_data:
