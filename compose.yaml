# Together the two containers stay within 0.75 CPU and 500 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

services:
  frontend:
    build: ./web
    container_name: comppulse-frontend
    restart: unless-stopped
    cpus: 0.30
    mem_limit: 200m
    memswap_limit: 200m
    pids_limit: 100
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      BACKEND_URL: http://backend:65524
      PORT: "65525"
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "127.0.0.1:65525:65525"
    networks:
      - edge
      - internal
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/65525 && printf 'GET /login HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: comppulse-backend
    restart: unless-stopped
    cpus: 0.45
    mem_limit: 300m
    memswap_limit: 300m
    pids_limit: 100
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/comppulse.db
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      HR_EMAIL: ${HR_EMAIL:-ss@interview.chetan}
      HR_PASSWORD: ${HR_PASSWORD:-incubyte}
      HR_PASSWORD_HASH: ${HR_PASSWORD_HASH:-}
      APP_ENV: ${APP_ENV:-production}
      TRUST_PROXY_HEADERS: "true"
      TOKEN_MAX_AGE_SECONDS: ${TOKEN_MAX_AGE_SECONDS:-43200}
      SEED_COUNT: ${SEED_COUNT:-10000}
    volumes:
      - db_data:/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/65524 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  # Docker does not publish a port for a container that is only on an
  # internal network. edge is the host-facing bridge for 127.0.0.1:65525.
  edge:
  internal:
    internal: true

volumes:
  db_data:
