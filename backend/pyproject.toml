[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comppulse-backend"
version = "0.1.0"
description = "CompPulse salary management API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "itsdangerous>=2",
  "pydantic>=2,<3",
  "pydantic-settings>=2",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
